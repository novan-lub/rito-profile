<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Profile</title>
  <link rel="stylesheet" href="style.css">

<body>

<header>
  <h1>rito</h1>

    <p>職業：ホスト</p>
    <p>人と過ごす時間と空間を大切にしています。</p>
  </div>
</section>

<section id="hobby" class="fade">
  <div class="glass">
    <h2>Hobby</h2>
    <p>🍾 お酒</p>
    <p>🎧 フェス</p>
    <p>🚗 車</p>
  </div>
</section>

<section id="contact" class="fade">
  <div class="glass">
    <h2>Contact</h2>
    <p>Instagram: @yourname</p>
  </div>
</section>

<script src="script.js"></script>

</html>
